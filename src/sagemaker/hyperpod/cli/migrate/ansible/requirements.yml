---
# Ansible collection dependencies for hpmigrate-ansible.
# Install with: ansible-galaxy collection install -r requirements.yml
collections:
  - name: amazon.aws
    version: ">=8.0.0"
  - name: community.aws
    version: ">=8.0.0"     # provides the aws_ssm connection plugin
  - name: ansible.posix
    version: ">=1.5.0"     # authorized_key, mount, etc.
