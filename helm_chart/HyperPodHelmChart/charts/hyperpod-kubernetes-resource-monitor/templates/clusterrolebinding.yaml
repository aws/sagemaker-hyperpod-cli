{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hyperpod-cluster-monitoring-agent.fullname" . }}
  labels:
    {{- include "hyperpod-cluster-monitoring-agent.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "hyperpod-cluster-monitoring-agent.serviceAccountName" . }}
  namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "hyperpod-cluster-monitoring-agent.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
