apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hyperpod-cluster-monitoring-agent.fullname" . }}
  namespace: {{ .Values.namespace }}
  {{- $imageRegionFallback := include "hyperpod-cluster-monitoring-agent.imageRegionFallback" . }}
  {{- if or .Values.podAnnotations $imageRegionFallback }}
  annotations:
    {{- with .Values.podAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $imageRegionFallback }}
    # The requested region has no HyperPod ECR repository; the image is pulled from us-east-1.
    sagemaker.amazonaws.com/image-region-fallback: {{ $imageRegionFallback | quote }}
    {{- end }}
  {{- end }}
  labels:
    {{- include "hyperpod-cluster-monitoring-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy.type }}
    {{- if eq .Values.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "hyperpod-cluster-monitoring-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hyperpod-cluster-monitoring-agent.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "hyperpod-cluster-monitoring-agent.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: log-volume
        hostPath:
          path: {{ .Values.volumes.logs.hostPath }}
          type: {{ .Values.volumes.logs.type }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: monitoring-agent
        image: {{ include "hyperpod-cluster-monitoring-agent.image" . | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/opt/amazon/bin/cluster-monitoring-agent"]
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['app']
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # Subject of monitor-level Events. Do not fold into POD_NAME above: that one is
        # the app label, and metric identity depends on it staying so.
        - name: CMA_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: CMA_POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CMA_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: CMA_VERSION
          value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
        {{- if .Values.kubeClient.qps }}
        - name: KUBE_CLIENT_QPS
          value: {{ .Values.kubeClient.qps | quote }}
        {{- end }}
        {{- if .Values.kubeClient.burst }}
        - name: KUBE_CLIENT_BURST
          value: {{ .Values.kubeClient.burst | quote }}
        {{- end }}
        - name: ENABLE_NODE_MONITOR
          value: {{ .Values.monitoring.enableNodeMonitor | quote }}
        - name: ENABLE_POD_MONITOR
          value: {{ .Values.monitoring.enablePodMonitor | quote }}
        - name: ENABLE_DAEMONSET_MONITOR
          value: {{ .Values.monitoring.enableDaemonsetMonitor | quote }}
        - name: ENABLE_HYPERPOD_PYTORCH_JOB_MONITOR
          value: {{ .Values.monitoring.enableHyperpodPytorchJobMonitor | quote }}
        - name: ENABLE_KUBEFLOW_V1_PYTORCH_JOB_MONITOR
          value: {{ .Values.monitoring.enableKubeflowV1PytorchJobMonitor | quote }}
        - name: ENABLE_KUBEFLOW_TRAINJOB_MONITOR
          value: {{ .Values.monitoring.enableKubeflowV2PytorchJobMonitor | quote }}
        - name: ENABLE_NCCL_RAS_MONITOR
          value: {{ .Values.monitoring.enableNcclRasMonitor | quote }}
        - name: ENABLE_LEADER_ELECTION
          value: {{ .Values.leaderElection.enabled | quote }}
        - name: ENABLE_HEALTH_STATUS_REPORT
          value: {{ .Values.healthStatusReport.enabled | quote }}
        - name: NECESSARY_DAEMONSETS
          value: {{ include "hyperpod-cluster-monitoring-agent.necessaryDaemonsetsJson" . | quote }}
        - name: MONITORED_NAMESPACES
          value: {{ join "," .Values.monitoring.monitoredNamespaces | quote }}
        {{- if .Values.monitoring.enableNcclRasMonitor }}
        - name: NCCL_RAS_NODES
          value: {{ .Values.monitoring.ncclRas.nodes | quote }}
        - name: NCCL_RAS_AUTO_DISCOVER
          value: {{ .Values.monitoring.ncclRas.autoDiscover | quote }}
        - name: NCCL_RAS_NODE_SELECTOR
          value: {{ .Values.monitoring.ncclRas.nodeSelector | quote }}
        - name: NCCL_RAS_PORT
          value: {{ .Values.monitoring.ncclRas.port | quote }}
        - name: NCCL_RAS_TIMEOUT
          value: {{ .Values.monitoring.ncclRas.timeout | quote }}
        - name: NCCL_RAS_MAX_RETRIES
          value: {{ .Values.monitoring.ncclRas.maxRetries | quote }}
        - name: NCCL_RAS_RETRY_DELAY
          value: {{ .Values.monitoring.ncclRas.retryDelay | quote }}
        - name: NCCL_RAS_MONITOR_INTERVAL
          value: {{ .Values.monitoring.ncclRas.monitorInterval | quote }}
        - name: NCCL_RAS_OUTPUT_DIR
          value: {{ .Values.monitoring.ncclRas.outputDir | quote }}
        {{- end }}
        ports:
        - name: health
          containerPort: 8081
          protocol: TCP
        volumeMounts:
        - name: log-volume
          mountPath: {{ .Values.volumes.logs.mountPath }}
        {{- if .Values.probes.startup.enabled }}
        startupProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
          failureThreshold: {{ .Values.probes.startup.failureThreshold }}
        {{- end }}
        {{- if .Values.probes.liveness.enabled }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
        {{- end }}
        {{- if .Values.probes.readiness.enabled }}
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
        {{- end }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
