{{- if .Values.webhook.enable }}
{{- if not .Values.certManager.enable }}
{{- fail "webhook.enable=true requires certManager.enable=true: the webhook's TLS certificate and CA bundle come from cert-manager" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hyperpod-compute-configuration.webhookName" . }}
  namespace: {{ include "hyperpod-compute-configuration.namespaceName" . }}
  labels:
    {{- include "hyperpod-compute-configuration.webhookLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.webhook.replicas }}
  selector:
    matchLabels:
      {{- include "hyperpod-compute-configuration.webhookSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hyperpod-compute-configuration.webhookLabels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: webhook
    spec:
      serviceAccountName: {{ include "hyperpod-compute-configuration.webhookName" . }}
      {{- with .Values.webhook.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Spread the pods over nodes so one node failure doesn't take every replica down.
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            {{- include "hyperpod-compute-configuration.webhookSelectorLabels" . | nindent 12 }}
      containers:
      - name: webhook
        image: {{ include "hyperpod-compute-configuration.webhookImage" . }}
        imagePullPolicy: {{ .Values.webhook.image.pullPolicy }}
        args:
        - --webhook-port={{ .Values.webhook.port }}
        - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
        - --health-probe-bind-address=:{{ .Values.webhook.healthProbePort }}
        - --zap-log-level={{ .Values.webhook.logLevel }}
        env:
        - name: WEBHOOK_VERSION
          value: {{ include "hyperpod-compute-configuration.webhookImageVersion" . | quote }}
        ports:
        - name: webhook
          containerPort: {{ .Values.webhook.port }}
          protocol: TCP
        - name: health
          containerPort: {{ .Values.webhook.healthProbePort }}
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          {{- toYaml .Values.webhook.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: serving-certs
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
      volumes:
      - name: serving-certs
        secret:
          secretName: {{ include "hyperpod-compute-configuration.webhookName" . }}-tls
      {{- with .Values.webhook.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webhook.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webhook.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
