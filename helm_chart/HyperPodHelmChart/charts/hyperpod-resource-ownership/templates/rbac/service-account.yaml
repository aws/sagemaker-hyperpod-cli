{{- if .Values.webhook.enable }}
# The webhook reads nothing from the API server (it only uses the AdmissionReview it is sent), so
# this service account has no Role or ClusterRole bindings. Its token stays mounted
# (automountServiceAccountToken is left on): the controller-runtime manager builds its client from
# the in-cluster config (ctrl.GetConfigOrDie), which reads the token file and fails without it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "resource-ownership.resourceName" (dict "suffix" "webhook" "context" $) }}
  namespace: {{ include "resource-ownership.namespaceName" . }}
  labels:
    {{- include "resource-ownership.labels" . | nindent 4 }}
{{- end }}
